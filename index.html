<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Finance - Loading...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f3f6f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e2e8f0;
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-weight: 700; margin-top: 16px;">Loading Small Finance...</p>
  <script>
    // Automatic fallback redirect if GitHub Pages points to main branch instead of gh-pages or actions
    var path = window.location.pathname;
    if (!path.endsWith('/')) path += '/';
    if (!path.includes('/out/')) {
      window.location.replace(path + 'out/index.html');
    }
  </script>
</body>
</html>
